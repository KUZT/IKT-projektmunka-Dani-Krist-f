<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px; /* opcionális térköz */
  }

  .col {
    background: #4c87ff;
    color: white;
    padding: 20px;
    border-radius: 6px;
  }
</style>

<div class="row">
  <div class="col">Első</div>
  <div class="col">Második</div>
</div>
</body>
</html>
